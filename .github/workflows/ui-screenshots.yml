# SPDX-License-Identifier: MIT OR Apache-2.0
# PR preview of the operator UI: build the arm64 kernel, boot it under QEMU,
# capture every TSV page 1:1, diff each against the published gallery on
# GitHub Pages (https://agentdavo.github.io/tinyOS/ui/), upload the PNGs as
# an artifact and comment on the PR. Never commits: the gallery itself is
# built and published from main by .github/workflows/pages.yml.

name: UI screenshots

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'devices/embedded_ui.tsv'
      - 'ui/**'
      - 'cli.cpp'
      - 'scripts/qemu_dump_ui_pages.sh'
      - 'scripts/generate_ui_md.py'
      - '.github/workflows/ui-screenshots.yml'
  workflow_dispatch:

permissions:
  contents: read
  # E20: post a comment on the triggering PR with the artifact link.
  # Needs issues:write because the comment API lives under /issues/N/comments
  # (PRs are issues at the REST level). pull-requests:write is required for
  # subscriber/notification routing on some GitHub plans.
  pull-requests: write
  issues: write

jobs:
  capture:
    runs-on: ubuntu-24.04
    # Build with the same toolchain as local development: Ubuntu 26.04's
    # GCC 15 cross compilers (24.04 only ships GCC 13, which rejected code
    # GCC 15 accepts and let CI and local builds drift apart).
    container: ubuntu:26.04
    # Container steps default to plain sh; the scripts use bash ([[ ]], arrays).
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    steps:
      - name: Install toolchain, QEMU, ffmpeg
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git gawk gh build-essential \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            qemu-system-arm \
            ffmpeg \
            python3 \
            python3-pil
          aarch64-linux-gnu-g++ --version | head -1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the PR diff step reads origin/main's screenshots

      - name: Trust the workspace for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build arm64 kernel
        run: make TARGET=arm64

      - name: Capture every TSV UI page
        # Native 1080x1920 captures (UI_DUMP_SCALE=1) so the preview shows the
        # screen exactly as the operator sees it. The script asks for
        # `ui_dump 1 rle`: a raw frame is 6.2 MB (over 3 min/page at the
        # ~32 KB/s the emulated UART manages here), the run-length encoded
        # one ~225 KB (a few seconds). Job capped at 30 min.
        env:
          UI_DUMP_SCALE: "1"
        run: |
          mkdir -p screenshots
          # Strip stale captures so deleted pages don't linger as orphan PNGs.
          find screenshots -maxdepth 1 -type f \( -name '*.png' -o -name '*.ppm' \) -delete
          bash scripts/qemu_dump_ui_pages.sh "$PWD/screenshots"
          # PPMs are intermediate; keep PNGs only.
          find screenshots -maxdepth 1 -type f -name '*.ppm' -delete
          ls -la screenshots/

      - name: Diff screenshots vs the published gallery (E19)
        # Compare each captured PNG against the gallery published from
        # main. Per-page pixel diff + bbox surface in the
        # PR comment below. Skipped on push to main (the new commit IS
        # the baseline). Tolerant: a missing baseline directory or PIL
        # import error still lets the workflow continue.
        if: github.event_name == 'pull_request'
        run: |
          # Baseline = the gallery published from main on GitHub Pages
          # (screenshots are no longer committed to the repo).
          mkdir -p /tmp/baseline_screenshots
          base="https://agentdavo.github.io/tinyOS/ui/screenshots"
          while IFS=$'\t' read -r page _; do
              [ -z "$page" ] && continue
              curl -fsSL "$base/$page.png" -o "/tmp/baseline_screenshots/$page.png" \
                  || rm -f "/tmp/baseline_screenshots/$page.png"
          done < screenshots/pages.tsv
          # Emit Markdown that the PR-comment step below picks up.
          python3 scripts/screenshot_diff.py screenshots /tmp/baseline_screenshots \
              > /tmp/screenshot_diff.md || true
          cat /tmp/screenshot_diff.md

      - name: Upload artifacts
        # Run even when capture / regenerate failed so partial PNGs and the
        # decoded kernel transcript (screenshots/kernel.log) are available
        # for diagnosis. Without this, a hung page leaves nothing to look
        # at and the next iteration is back to guessing.
        id: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: |
            screenshots/*.png
            screenshots/pages.tsv
            screenshots/kernel.log
          if-no-files-found: warn

      - name: Post artifact link on PR (E20)
        # On pull_request events, drop a one-line comment with the artifact
        # download URL so reviewers don't have to drill into the Actions
        # tab to find the rendered screenshots. Runs whether the capture
        # passed or failed (a failed run is still worth signalling — the
        # kernel.log artifact has the diagnostic trail). Skipped on cross-
        # repo PRs because GITHUB_TOKEN can't post comments back to the
        # base repo from a fork PR's context.
        if: |
          always() &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          JOB_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_OUTCOME: ${{ job.status }}
        run: |
          # Embed a screenshot summary by counting rendered PNGs and
          # noting any that came in below 600 bytes — those are the
          # "blank fallback" we used to ship before the heap bump in #19.
          png_count=$(find screenshots -maxdepth 1 -name '*.png' -type f 2>/dev/null | wc -l)
          suspicious=$(find screenshots -maxdepth 1 -name '*.png' -type f -size -600c 2>/dev/null | wc -l)
          status_icon="🟢"
          if [ "${RUN_OUTCOME}" = "failure" ] || [ "${RUN_OUTCOME}" = "cancelled" ]; then
              status_icon="🔴"
          elif [ "$suspicious" -gt 0 ]; then
              status_icon="🟡"
          fi
          # Build the comment body line-by-line into a temp file. A
          # `<<EOF` heredoc would have to drop its body to column 1, which
          # collides with the YAML block-scalar parser (the leading `-`
          # for the bullet list looks like a YAML sequence item).
          body_file=$(mktemp)
          {
              printf '%s **UI screenshots** — captured %s pages. Status: `%s`.\n' "${status_icon}" "${png_count}" "${RUN_OUTCOME}"
              printf '\n'
              printf -- '- 📦 Artifact: %s\n' "${ARTIFACT_URL}"
              printf -- '- 🪵 Workflow run: %s\n' "${JOB_URL}"
              if [ "$suspicious" -gt 0 ]; then
                  printf -- '- ⚠️ %s page(s) under 600 bytes — possible blank-fallback render. Pull the artifact zip to inspect.\n' "${suspicious}"
              fi
              # E19: per-page diff vs main baseline.
              if [ -s /tmp/screenshot_diff.md ]; then
                  printf '\n'
                  cat /tmp/screenshot_diff.md
              fi
              printf '\n'
              printf '_Auto-posted by `.github/workflows/ui-screenshots.yml`. Comment updates on each push to this PR._\n'
          } > "${body_file}"
          body=$(cat "${body_file}")
          # Find any prior comment from this workflow on this PR and
          # update it in place so we don't pile up one comment per push.
          marker='Auto-posted by `.github/workflows/ui-screenshots.yml`'
          existing=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              --jq ".[] | select(.body | contains(\"${marker}\")) | .id" | head -n1)
          if [ -n "$existing" ]; then
              gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" \
                  -f body="${body}"
              echo "Updated existing comment ${existing}"
          else
              gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
                  -f body="${body}"
              echo "Posted new comment"
          fi
